# This file was generated by the Gradle 'init' task.
# https://docs.gradle.org/current/userguide/version_catalogs.html#sec::toml-dependencies-format

[versions]
lwjgl = "3.4.3"
joml = "1.10.8"
jackson = "2.20.1"
javafx = "27"
openjfx-plugin = "0.1.0"

[libraries]
lwjgl-bom = { module = "org.lwjgl:lwjgl-bom", version.ref = "lwjgl" }
lwjgl-core = { module = "org.lwjgl:lwjgl" }
lwjgl-freetype = { module = "org.lwjgl:lwjgl-freetype" }
lwjgl-glfw = { module = "org.lwjgl:lwjgl-glfw" }
lwjgl-openal = { module = "org.lwjgl:lwjgl-openal" }
lwjgl-opengl = { module = "org.lwjgl:lwjgl-opengl" }
lwjgl-stb = { module = "org.lwjgl:lwjgl-stb" }

joml = { module = "org.joml:joml", version.ref = "joml" }

jackson-databind = { module = "com.fasterxml.jackson.core:jackson-databind", version.ref = "jackson" }
jackson-dataformat-xml = { module = "com.fasterxml.jackson.dataformat:jackson-dataformat-xml", version.ref = "jackson" }

[plugins]
javafx = { id = "org.openjfx.javafxplugin", version.ref = "openjfx-plugin" }
